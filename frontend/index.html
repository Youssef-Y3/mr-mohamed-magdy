<style>
  html, body { font-family: 'Cairo', system-ui, sans-serif; }
  body {
    background: #F7F7FB;
    color: #0B0B18;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .dark body { background: #050510; color: #EEF0F7; }

  /* عرض دائم للسكرول بار الأنيق */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(124, 58, 237, 0.3); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(124, 58, 237, 0.5); }

  /* blobs animation */
  @keyframes blobFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -50px) scale(1.1); }
    66% { transform: translate(-20px, 20px) scale(0.9); }
  }
  .blob { animation: blobFloat 20s ease-in-out infinite; filter: blur(60px); }

  /* text gradient */
  .text-gradient-brand {
    background: linear-gradient(135deg, #4338CA 0%, #7C3AED 50%, #A78BFA 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Glass card */
  .glass-light {
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.6);
  }
  .glass-dark {
    background: rgba(20, 18, 45, 0.55);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(139, 92, 246, 0.15);
  }

  /* Custom range for video player */
  .video-range {
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    background: transparent;
    cursor: pointer;
  }
  .video-range::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 12px rgba(139, 92, 246, 0.8);
    cursor: pointer;
  }
  .video-range::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    border: none;
    box-shadow: 0 0 12px rgba(139, 92, 246, 0.8);
    cursor: pointer;
  }

  /* Hide default video controls when using custom */
  video::-webkit-media-controls { display: none !important; }

  /* No text selection on UI chrome */
  .no-select { user-select: none; -webkit-user-select: none; }

  /* Reel snap container */
  .reels-scroll {
    scroll-snap-type: y mandatory;
    overflow-y: scroll;
    height: 100dvh;
    scrollbar-width: none;
  }
  .reels-scroll::-webkit-scrollbar { display: none; }
  .reel-item {
    scroll-snap-align: start;
    scroll-snap-stop: always;
    height: 100dvh;
  }

  /* Cell division loader */
  @keyframes cellDivide {
    0%, 100% { transform: translateX(0); opacity: 1; }
    50% { transform: translateX(var(--dist, 14px)); opacity: 0.85; }
  }
  .cell-a { animation: cellDivide 1.4s ease-in-out infinite; --dist: -14px; }
  .cell-b { animation: cellDivide 1.4s ease-in-out infinite; --dist: 14px; }

  /* DNA rotate */
  @keyframes dnaSpin { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
  .dna-spin { animation: dnaSpin 6s linear infinite; transform-style: preserve-3d; }

  /* ripple between reels */
  @keyframes ripple {
    from { transform: scale(0); opacity: 0.5; }
    to { transform: scale(2.5); opacity: 0; }
  }
  .ripple-anim { animation: ripple 700ms ease-out forwards; }

  /* floating particles */
  @keyframes floatUp {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    10% { opacity: var(--op, 0.5); }
    90% { opacity: var(--op, 0.5); }
    100% { transform: translateY(-110vh) translateX(var(--drift, 20px)); opacity: 0; }
  }
  .particle { animation: floatUp linear infinite; }

  /* confetti dots */
  @keyframes confettiBurst {
    0% { transform: translate(0,0) scale(0); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(1); opacity: 0; }
  }
  .confetti-dot { animation: confettiBurst 1.2s ease-out forwards; }

  /* progress shimmer */
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .shimmer {
    background: linear-gradient(90deg, transparent, rgba(139,92,246,0.15), transparent);
    background-size: 200% 100%;
    animation: shimmer 1.6s linear infinite;
  }

  /* input styles */
  .field {
    width: 100%;
    padding: 0.85rem 1rem;
    border-radius: 0.9rem;
    background: rgba(255,255,255,0.9);
    border: 1.5px solid rgba(124,58,237,0.15);
    outline: none;
    transition: all 0.2s;
    font-family: inherit;
    font-size: 0.95rem;
  }
  .field:focus { border-color: #7C3AED; box-shadow: 0 0 0 4px rgba(124,58,237,0.12); }
  .dark .field { background: rgba(30,27,75,0.5); border-color: rgba(139,92,246,0.25); color: #EEF0F7; }
  .dark .field:focus { border-color: #A78BFA; box-shadow: 0 0 0 4px rgba(167,139,250,0.15); }

  .btn-primary {
    background: linear-gradient(135deg, #4338CA 0%, #7C3AED 100%);
    color: white;
    border: none;
    padding: 0.85rem 1.5rem;
    border-radius: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 8px 24px -8px rgba(124,58,237,0.6);
  }
  .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 14px 32px -8px rgba(124,58,237,0.7); }
  .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

  .btn-ghost {
    background: rgba(124,58,237,0.08);
    color: #4338CA;
    padding: 0.85rem 1.5rem;
    border-radius: 0.9rem;
    font-weight: 600;
    border: 1.5px solid rgba(124,58,237,0.18);
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-ghost:hover { background: rgba(124,58,237,0.15); }
  .dark .btn-ghost { background: rgba(139,92,246,0.14); color: #C4B5FD; border-color: rgba(139,92,246,0.3); }

  /* animated grid line background for dark hero */
  .grid-bg {
    background-image:
      linear-gradient(rgba(124,58,237,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,58,237,0.06) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .dark .grid-bg {
    background-image:
      linear-gradient(rgba(139,92,246,0.09) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139,92,246,0.09) 1px, transparent 1px);
  }

  /* hide scrollbar for reels admin thumbs */
  .noscroll::-webkit-scrollbar { display: none; }
  .noscroll { scrollbar-width: none; }

  /* skeleton */
  .sk {
    background: linear-gradient(90deg, rgba(0,0,0,0.05) 0%, rgba(124,58,237,0.08) 50%, rgba(0,0,0,0.05) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.5s linear infinite;
    border-radius: 0.75rem;
  }
  .dark .sk {
    background: linear-gradient(90deg, rgba(255,255,255,0.04) 0%, rgba(139,92,246,0.1) 50%, rgba(255,255,255,0.04) 100%);
    background-size: 200% 100%;
  }
</style>
